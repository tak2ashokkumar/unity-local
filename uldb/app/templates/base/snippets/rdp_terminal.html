<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RDP</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body,#display{width:100%;height:100%;overflow:hidden;background:#000}
#errmsg{
    display:none;position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.85);color:#fca5a5;border:1px solid #ef4444;
    padding:18px 28px;border-radius:4px;font-family:sans-serif;font-size:13px;
    text-align:center;white-space:pre-wrap;z-index:999;pointer-events:none;
    min-width:220px;
}
</style>
</head>
<body>
<div id="display"></div>
<div id="errmsg"></div>

<script src="/static/js/guac.js"></script>
<script>
(function(){
'use strict';

var display_el = document.getElementById('display');
var errmsg     = document.getElementById('errmsg');

if (typeof Guacamole === 'undefined') {
    errmsg.textContent = 'Guacamole library failed to load.\nCheck /static/js/guac.js';
    errmsg.style.display = 'block';
    return;
}

var SESSION_ID   = '{{ session_id }}';
var COLLECTOR_CN = '{{ collector_cn }}';
var HOST         = '{{ host }}';
var PORT         = {{ port }};
var USERNAME     = '{{ username|escapejs }}';
var PASSWORD     = '{{ password|escapejs }}';
var DOMAIN       = '{{ domain|escapejs }}';

var proto  = (location.protocol === 'https:') ? 'wss://' : 'ws://';
var wsurl  = proto + location.host + '/webterminal/rdp/' + SESSION_ID + '/';
var dispW  = display_el.clientWidth  || window.innerWidth;
var dispH  = display_el.clientHeight || window.innerHeight;

var params = [
    'collector_cn=' + encodeURIComponent(COLLECTOR_CN),
    'target_host='  + encodeURIComponent(HOST),
    'target_port='  + PORT,
    'username='     + encodeURIComponent(USERNAME),
    'password='     + encodeURIComponent(PASSWORD),
    'domain='       + encodeURIComponent(DOMAIN),
    'width='        + dispW,
    'height='       + dispH,
].join('&');

var tunnel = new Guacamole.WebSocketTunnel(wsurl);
var client = new Guacamole.Client(tunnel);

var disp = client.getDisplay().getElement();
display_el.appendChild(disp);

function scaleDisplay() {
    var dw = client.getDisplay().getWidth();
    var dh = client.getDisplay().getHeight();
    if (dw <= 0 || dh <= 0) return;
    var scale = Math.min(display_el.clientWidth / dw, display_el.clientHeight / dh);
    client.getDisplay().scale(scale);
}
client.getDisplay().onresize = scaleDisplay;
window.addEventListener('resize', scaleDisplay);

client.onerror = function(err) {
    var txt = (err && err.message) ? err.message
            : (err && err.code)    ? 'Error ' + err.code
            : JSON.stringify(err);
    errmsg.textContent = 'RDP Error:\n' + txt;
    errmsg.style.display = 'block';
};

var mouse    = new Guacamole.Mouse(disp);
var keyboard = new Guacamole.Keyboard(document);
function fwd(ms){ client.sendMouseState(ms); }
mouse.onmousedown = mouse.onmouseup = mouse.onmousemove = fwd;
disp.addEventListener('contextmenu', function(e){ e.preventDefault(); });


var pasteShortcutPending = false;
var V_KEYSYM = 0x76;
keyboard.onkeydown = function(k) {
    if (k === V_KEYSYM && (keyboard.modifiers.ctrl || keyboard.modifiers.meta)) {
        pasteShortcutPending = true;
        return true;
    }
    client.sendKeyEvent(1, k);
    return false;
};
keyboard.onkeyup = function(k) {
    if (k === V_KEYSYM && pasteShortcutPending) {
        pasteShortcutPending = false;
        return;
    }
    client.sendKeyEvent(0, k);
};

function copyToLocalClipboard(text) {
    if (!text) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function() {
            copyToLocalClipboardFallback(text);
        });
        return;
    }
    copyToLocalClipboardFallback(text);
}

function copyToLocalClipboardFallback(text) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', 'readonly');
    textarea.style.position = 'fixed';
    textarea.style.left = '-10000px';
    textarea.style.top = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(textarea);
}

client.onclipboard = function(stream, mimetype) {
    var type = (mimetype || '').toLowerCase().split(';', 1)[0].trim();
    if (type !== 'text/plain') {
        stream.sendAck('Unsupported clipboard mimetype', 0x0100);
        return;
    }
    var reader = new Guacamole.StringReader(stream);
    var data = '';
    reader.ontext = function(text) {
        data += text;
        stream.sendAck('OK', 0x0000);
    };
    reader.onend = function() {
        copyToLocalClipboard(data);
    };
};

function sendClipboardText(text) {
    if (!text) return;
    try {
        var stream = client.createClipboardStream('text/plain');
        var writer = new Guacamole.StringWriter(stream);
        writer.sendText(text);
        writer.sendEnd();
    } catch (e) {}
}

document.addEventListener('paste', function(e) {
    var cbData = e.clipboardData || window.clipboardData;
    var text = cbData && cbData.getData
        ? (cbData.getData('text/plain') || cbData.getData('text'))
        : '';
    if (!text) return;

    e.preventDefault();
    e.stopPropagation();
    sendClipboardText(text);

    window.setTimeout(function() {
        if (pasteShortcutPending && keyboard.modifiers.ctrl) {
            client.sendKeyEvent(1, V_KEYSYM);
            client.sendKeyEvent(0, V_KEYSYM);
        }
        else {
            client.sendKeyEvent(1, 0xFFE3);
            client.sendKeyEvent(1, V_KEYSYM);
            client.sendKeyEvent(0, V_KEYSYM);
            client.sendKeyEvent(0, 0xFFE3);
        }
    }, 100);
}, true);

window.addEventListener('beforeunload', function(){
    try { client.disconnect(); } catch(e){}
});

client.connect(params);
}());
</script>
</body>
</html>
