<app-main-tab [tabItems]="tabItems"></app-main-tab>
<div class="card rounded-0 border-top-0">
  <div class="card-header bg-white d-flex justify-content-between align-items-center p-0 pb-2 mt-2">
    <div class="d-flex align-items-center justify-content-center">
      <span class="badge bg-secondary instance-count font-weight-bold ml-3 mt-1 rounded-3">{{viewData.length}}</span>
      <span class="ml-2 font-weight-bold">Azure Accounts</span>
    </div>
    <div class="d-flex align-items-center justify-content-end">
      <button class="action-icons fas fa-plus mr-1" tooltip="Add account" (click)="addAzureAccount()"></button>
      <button class="btn btn-pill btn-warning pull-right btn-sm ml-1" type="button" container="body"
        (click)="goBack()"><i class="fa fa-arrow-left"></i>
      </button>
      <data-refresh-btn [page]="currentCriteria.pageNo" (refresh)="refreshData($event)" class="mr-3"></data-refresh-btn>
    </div>
  </div>
  <div class="card-body">
    <table class="table text-left">
      <thead class="bg-light">
        <tr>
          <th>Client ID</th>
          <th>Client Secret</th>
          <th>Tenant ID</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let view of viewData; let i = index;">
          <td>{{view.clientId}}</td>
          <td>{{view.clientSecret}}</td>
          <td>{{view.tenantId}}</td>
          <td>
            <button class="action-icons mb-0 fas fa-pencil-alt font-sm ml-1" tooltip="Edit"
              (click)="editAzureAccount(i)">
            </button>
            <button class="action-icons mb-0 fas fa-trash-alt font-sm ml-1" tooltip="Delete Account"
              (click)="deleteAzureAccount(i)">
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <!-- <table-entries [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize"
      [totalCount]="filteredViewData.length"></table-entries>
    <table-pager *ngIf="filteredViewData.length" [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize"
      [totalCount]="filteredViewData.length" (pageChange)="pageChange($event)"></table-pager> -->
    <div class="d-flex py-5 justify-content-center align-items-center" *ngIf="!viewData.length">No Accounts available.
    </div>
  </div>
</div>

<azure-crud (onCrud)="onCrud($event)"></azure-crud>
