<div class="row">
    <div class="col">
        <div class="card">
            <div class="card-header bg-white">
                <div class="row justify-content-between">
                    <div class="col-5 font-weight-bold">
                        <span
                            class="badge bg-secondary user-count font-weight-bold rounded-3 align-middle">{{count}}</span>
                        <span class="ml-2 font-weight-bold align-middle">Accounts</span>
                    </div>
                    <div class="col">
                        <data-refresh-btn [page]="currentCriteria.pageNo"
                            (refresh)="refreshData($event)"></data-refresh-btn>
                        <button class="btn btn-pill btn-warning pull-right btn-sm ml-2" type="button" container="body"
                            (click)="goBack()"><i class="fa fa-arrow-left"></i>
                        </button>
                        <button class="btn btn-warning btn-sm pull-right" accessControl moduleName="Service Management"
                            accessType="write" elementType="btn" (click)="add()">
                            <i class="fas fa-plus"></i>&nbsp;Account</button>
                    </div>
                </div>
            </div>
            <div class="card-body pt-2">
                <div class="row pb-2">
                    <div class="col-2">
                        <table-search-box [searchValue]="currentCriteria.searchValue"
                            (searched)="onSearched($event)"></table-search-box>
                    </div>

                                        <option [value]="'Low'">Low</option>

                            </div>

                </div>
                <table class="table text-left" sortableTable (sorted)="onSorted($event)">
                    <thead class="bg-light">
                        <tr>
                            <th> Account Name</th>
                            <th>User Name</th>
                            <th>Instance URL</th>
                            <th>Tenant</th>
                            <th class="text-center">ITSM</th>
                            <th class="text-center">CMDB</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr setTableColumnWidth *ngFor="let view of viewData">
                            <td class="text-primary pointer-link">{{view.name}}</td>
                            <td>
                                <div class="text-capitalize">{{view.username}}</div>
                            </td>
                            <td>{{view.instanceUrl}}</td>
                            <td>{{view.tenantName}}
                                <span *ngIf="view.tenantsBadgeCount"
                                    class="badge bg-secondary group-count rounded-3 w-auto ml-1" [popover]="popTemplate"
                                    container="body" (click)="showTenants(view)"
                                    [outsideClick]="true">+{{view.tenantsBadgeCount}}</span>
                            </td>
                            <td class="text-center">
                                <div *ngIf="view.isItsm" class="fas fa-check"></div>
                            </td>

                            <td class="text-center">
                                <div *ngIf="view.isCmdb" class="fas fa-check"></div>
                            </td>

                            <td class="action-icons-column">
                                <button class="action-icons mb-0 fas fa-pencil-alt font-sm ml-1" [tooltip]="'Edit'"
                                    (click)="edit(view)" accessControl moduleName="Service Management"
                                    accessType="write" elementType="actionbtn"></button>
                                <button class="action-icons mb-0 fas fa-trash-alt font-sm ml-1" [tooltip]="'Delete'"
                                    (click)="delete(view)" accessControl moduleName="Service Management"
                                    accessType="write" elementType="actionbtn"></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <table-entries [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize"
                    [totalCount]="count"></table-entries>

                <table-pager *ngIf="viewData.length" [pageNo]="currentCriteria.pageNo"
                    [pageSize]="currentCriteria.pageSize" [totalCount]="count"
                    (pageChange)="pageChange($event)"></table-pager>
                <div class="text-center text-muted" *ngIf="!viewData.length">No associated ServiceNow instances found.
                </div>
            </div>
        </div>
    </div>
</div>
<ng-template #popTemplate>
    <div *ngFor="let name of popOverList">{{name}}</div>
</ng-template>



<ng-template #confirm>
    <div class="card round-edge mb-0">
        <div class="card-body text-center pb-2">
            <div>Are you sure you want to delete?</div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-center border-top-0">
            <button class="btn btn-sm btn-pill btn-warning mr-2" type="button" (click)="confirmDelete()">Delete</button>
            <button class="btn btn-sm btn-pill btn-outline-warning" type="button"
                (click)="modalRef.hide()">Cancel</button>
        </div>
    </div>
</ng-template>
