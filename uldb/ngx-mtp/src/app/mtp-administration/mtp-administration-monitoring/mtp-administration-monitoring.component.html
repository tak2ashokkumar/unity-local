<div class="row">
    <div class="col-2 pr-0">
        <div class="card">
            <div class="card-header text-center bg-white border-bottom-0 pb-0">
                <h6>Monitoring</h6>
            </div>
            <div class="card-body pt-0 px-2" style="min-height:200px;">
                <div class="mt-2">
                    <button class="text-left btn btn-block" type="button" [ngClass]="isActive('template')"
                        (click)="goTo('templates')"><i class="fas fa-file mr-2"></i>Templates</button>
                </div>
                <div class="form mt-4" *ngIf="templateId && templates.length">
                    <div class="form-group">
                        <label class="form-col-form-label">Template</label>
                        <select class="form-control border" type="text" [(ngModel)]="templateId"
                            (change)="goToTemplate($event.target.value)">
                            <option [value]="null">Show all Templates</option>
                            <option *ngFor="let template of templates" [value]="template.template_id">
                                {{template.template_name}}
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-col-form-label">Discovered Item</label>
                        <select class="form-control border" type="text" [(ngModel)]="componentId"
                            (change)="goToComponent($event.target.value)">
                            <option [value]="null">No Item Selected</option>
                            <option *ngFor="let component of components" [value]="component.discovery_rule_id">
                                {{component.discovery_rule_name}}
                            </option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-10">
        <router-outlet></router-outlet>
    </div>
</div>
