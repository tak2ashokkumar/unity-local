<div class="row">
    <div class="col">
        <div class="card">
            <div class="card-header bg-white">
                <div class="row">
                    <div class="col-3">
                        <span class="badge bg-secondary user-count font-weight-bold p-1 font-sm">{{count}}</span>
                        <span class="ml-1 h5">Events</span>
                    </div>
                    <div class="col">
                        <data-refresh-btn [page]="currentCriteria.pageNo"
                            (refresh)="refreshData($event)"></data-refresh-btn>
                        <button class="btn btn-primary btn-sm pull-right" (click)="addEvent()" accessControl
                            moduleName="Service Management" accessType="write" elementType="btn">
                            <i class="fas fa-plus"></i>&nbsp;Event</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-2">
                        <table-search-box (searched)="onSearched($event)"></table-search-box>
                    </div>
                    <div class="col-10">
                        <div class="row justify-content-end">
                            <div class="col-2">
                                <div class="form-group">
                                    <multiselect-dropdown class="form-control p-0" style="height:auto;"
                                        [options]="tenants" [settings]="tenantSettings"
                                        [(ngModel)]="currentCriteria.multiValueParam.tenant"
                                        [texts]="tenantSelectionTexts"
                                        (dropdownClosed)="onFilterChange()"></multiselect-dropdown>
                                </div>
                            </div>
                            <div class="col-2">
                                <select class="form-control form-control-sm" type="text"
                                    [(ngModel)]="currentCriteria.params[0].ticket_type"
                                    (ngModelChange)="onFilterChange()">
                                    <option [value]="''">Select Type</option>
                                    <option *ngFor="let ticket of ticketOptions" [value]="ticket.value">
                                        {{ticket.label}}</option>
                                </select>
                            </div>
                            <div class="col-2">
                                <select class="form-control form-control-sm" type="text"
                                    [(ngModel)]="currentCriteria.params[0].severity" (ngModelChange)="onFilterChange()">
                                    <option [value]="''">Select Severity</option>
                                    <option *ngFor="let severity of severityOptions" [value]="severity.value">
                                        {{severity.label}}</option>
                                </select>
                            </div>
                            <div class="col-2">
                                <div class="form-group">
                                    <multiselect-dropdown class="form-control p-0" style="height:auto;"
                                        [options]="eventOptions" [settings]="eventSettings"
                                        [(ngModel)]="currentCriteria.multiValueParam.event"
                                        [texts]="eventSelectionTexts"
                                        (dropdownClosed)="onFilterChange()"></multiselect-dropdown>
                                </div>
                            </div>
                            <div class="col-2">
                                <select class="form-control form-control-sm" type="text"
                                    [(ngModel)]="currentCriteria.params[0].status" (ngModelChange)="onFilterChange()">
                                    <option [value]="''">Select Status</option>
                                    <option *ngFor="let status of statusOptions" [value]="status.value">
                                        {{status.label}}</option>
                                </select>
                            </div>
                            <div class="mx-2">
                                <table-page-size [currentPageSize]="currentCriteria.pageSize" [totalCount]="count"
                                    (pageSizeChange)="pageSizeChange($event)"></table-page-size>
                            </div>
                        </div>
                    </div>
                </div>
                <table class="table text-left">
                    <thead class="bg-light">
                        <tr>
                            <th>Event</th>
                            <th>Tenant</th>
                            <th>Severity</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let view of viewData; let i = index" truncateText>
                            <td class="tdw-20">
                                <span>{{view.event}}</span>
                                <span *ngIf="view.eventBadgeCount"
                                    class="badge text-primary bg-lb group-count rounded-3 w-auto ml-1 pointer-link"
                                    [popover]="popTemplate" container="body" (click)="showEvents(view)"
                                    [outsideClick]="true">+{{view.eventBadgeCount}}</span>
                            </td>
                            <td class="tdw-15">
                                <span>{{view.tenantName}}</span>
                                <span *ngIf="view.tenantBadgeCount"
                                    class="badge text-primary bg-lb group-count rounded-3 w-auto ml-1 pointer-link"
                                    [popover]="popTenantTemplate" container="body" (click)="showTenants(view)"
                                    [outsideClick]="true">+{{view.tenantBadgeCount}}</span>
                            </td>
                            <td class="tdw-15 text-capitalize">
                                {{view.severity}}
                            </td>
                            <td class="tdw-15">
                                <div>{{view.ticketType}}</div>
                            </td>
                            <td class="tdw-20">
                                <div class="d-inline-block">
                                    <div class="btn-group rounded-pill border" style="border-radius: 50px;">
                                        <button class="btn btn-pill btn-sm btn-outline-primary rounded-pill border-0"
                                            type="button" (click)="toggleStatus(view.eventId, true)"
                                            [disabled]="view.isDefault"
                                            [ngClass]=" view.eventStatus? 'active btn-outline-primary' : 'btn-outline-secondary' ">
                                            Enable
                                        </button>
                                        <button class="btn btn-pill btn-sm btn-outline-primary rounded-pill border-0"
                                            type="button" (click)="toggleStatus(view.eventId, false)"
                                            [disabled]="view.isDefault"
                                            [ngClass]="!view.eventStatus? 'active btn-outline-primary' : 'btn-outline-secondary' ">
                                            Disable
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td class="action-icons-column">
                                <button class="action-icons mb-0 fas fa-envelope font-sm" tooltip="Customize Email"
                                    (click)="goToCustomizeEmail(view)"></button>
                                <button class="action-icons mb-0 fas fa-pencil-alt font-sm ml-2" tooltip="Edit"
                                    (click)="editEvent(i)"></button>
                                <button class="action-icons mb-0 fas fa-trash-alt font-sm ml-2" tooltip="Delete"
                                    (click)="deleteEvent(i)"></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <table-entries [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize"
                    [totalCount]="count">
                </table-entries>
                <table-pager *ngIf="viewData.length" [pageNo]="currentCriteria.pageNo"
                    [pageSize]="currentCriteria.pageSize" [totalCount]="count"
                    (pageChange)="pageChange($event)"></table-pager>
                <div class="text-center text-muted py-5" *ngIf="!viewData.length">No notification groups available.
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #confirm>
    <div class="card round-edge mb-0">
        <div class="card-body text-center pb-2">
            <div>Are you sure you want to delete?</div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-center border-top-0">
            <button class="btn btn-sm btn-pill btn-warning mr-2" type="button" (click)="confirmDelete()">Delete</button>
            <button class="btn btn-sm btn-pill btn-outline-warning" type="button"
                (click)="modalRef.hide()">Cancel</button>
        </div>
    </div>
</ng-template>

<ng-template #popTemplate>
    <div *ngFor="let name of eventsList">{{name}}</div>
</ng-template>


<ng-template #popTenantTemplate>
    <div *ngFor="let name of tenantList">{{name}}</div>
</ng-template>
