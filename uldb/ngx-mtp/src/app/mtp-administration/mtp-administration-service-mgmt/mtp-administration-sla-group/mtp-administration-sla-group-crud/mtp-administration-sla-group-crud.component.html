<div class="row">
    <div class="col">
        <div class="card">
            <div class="card-header bg-white">
                <div class="row justify-content-between">
                    <div class="col-5 font-weight-bold">
                        <span class="align-middle">{{action}} Group</span>
                    </div>
                    <div class="col-1">
                        <button class="btn btn-pill btn-warning pull-right btn-sm ml-2" type="button" container="body"
                            (click)="goBack()"><i class="fa fa-arrow-left"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <form *ngIf="form" class="form-horizontal" [formGroup]="form">
                    <div class="form-group text-center" *ngIf="nonFieldErr">
                        <div class="invalid-credentials" *ngIf="nonFieldErr">{{nonFieldErr}}</div>
                    </div>
                    <div class="form-group row">
                        <div class="col-2 text-right">SLA Group Name<em>*</em> : </div>
                        <div class="col-4">
                            <input id="name" class="form-control form-control-sm" type="text" formControlName="name"
                                [class.is-invalid]="formErrors.name">
                            <small class="invalid-feedback" *ngIf="formErrors.name">{{formErrors.name}}</small>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class=" col-2 text-right">Tenants : </div>
                        <div class="col-3">
                            <multiselect-dropdown class="form-control form-control-sm p-0" style="height:auto;"
                                [settings]="tenantSettings" [options]="tenants" formControlName="tenants"
                                [class.is-invalid]="formErrors.tenants"></multiselect-dropdown>
                            <small class="invalid-feedback" *ngIf="formErrors.tenants">{{formErrors.tenants}}</small>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-2 text-right">Description : </div>
                        <div class="col">
                            <textarea class="form-control" id="description" formControlName="description"
                                placeholder="Description"></textarea>
                        </div>
                    </div>
                </form>
                <div class="d-flex justify-content-center">
                    <button class="btn btn-primary mr-2" (click)="submit()">Submit</button>
                    <button class="btn btn-md btn-outline-danger" (click)="goBack()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
