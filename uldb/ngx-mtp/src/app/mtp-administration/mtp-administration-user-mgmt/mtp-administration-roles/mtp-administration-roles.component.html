<div class="card round-edge">
    <div class="card-header bg-white pl-0 py-2">
        <span class="badge bg-secondary role-count font-weight-bold ml-3 mt-1 rounded-3">{{count}}</span>
        <span class="ml-2 font-weight-bold">Roles</span>
        <!-- <button class="action-icons fas fa-plus pull-right mb-2 mr-1" tooltip="Add role"></button> -->
        <data-refresh-btn [page]="currentCriteria.pageNo" (refresh)="refreshData($event)"></data-refresh-btn>
    </div>
    <div class="card-body pt-0">
        <div class="row my-3">
            <div class="col-2">
                <table-search-box (searched)="onSearched($event)"></table-search-box>
            </div>
            <div class="col-10">
                <div class="row justify-content-end">
                    <div class="col-2">
                        <select class="form-control form-control-sm" type="text"
                            [(ngModel)]="currentCriteria.params[0].role_type" (ngModelChange)="onFilterChange()">
                            <option [value]="''">Select Type</option>
                            <option [value]="'MSP'">MSP</option>
                            <option [value]="'Tenant'">Tenant</option>
                        </select>
                    </div>
                    <!-- <div class="col-2">
                        <select class="form-control form-control-sm" type="text">
                            <option [value]="''" disabled>Permission</option>
                        </select>
                    </div> -->
                    <div class="mx-2">
                        <table-page-size [currentPageSize]="currentCriteria.pageSize" [totalCount]="count"
                            (pageSizeChange)="pageSizeChange($event)"></table-page-size>
                    </div>
                </div>
            </div>
        </div>
        <table class="table text-left" sortableTable (sorted)="onSorted($event)">
            <thead class="bg-light">
                <tr>
                    <th>Role Name</th>
                    <th>User Type</th>
                    <th>Permission</th>
                    <th>Role Type</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let view of viewData; let i = index" setTableColumnWidth>
                    <td class="text-capitalize">{{view.name}}</td>
                    <td>{{view.userType}}</td>
                    <td></td>
                    <td>{{view.roleType}}</td>
                    <td class="action-icons-column text-center">
                        <button class="action-icons mb-0 fas fa-user font-sm ml-1" tooltip="Assign User"
                            (click)="assignUser(view)" accessControl moduleName="User Management" accessType="write"
                            elementType="actionbtn"></button>
                    </td>
                </tr>
            </tbody>
        </table>
        <table-entries [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize" [totalCount]="count">
        </table-entries>
        <table-pager *ngIf="viewData.length" [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize"
            [totalCount]="count" (pageChange)="pageChange($event)"></table-pager>
        <div *ngIf="!viewData.length" class="d-flex py-5 justify-content-center align-items-center">
            No roles available.
        </div>
    </div>
</div>

<ng-template #assign>
    <div class="card mb-0">
        <div class="card-header">
            Assign User
            <div class="card-header-actions">
                <a class="card-header-action btn-close" (click)="modalRef.hide()">
                    <i class="fas fa-times"></i>
                </a>
            </div>
        </div>
        <div class="card-body pt-0">
            <form *ngIf="roleForm" [formGroup]="roleForm">
                <div class="form-group">
                    <div class="invalid-credentials" *ngIf="nonFieldErr">{{nonFieldErr}}</div>
                </div>
                <!-- <div class="form-group">
                    <label class="form-col-form-label">User Type<em>*</em></label>
                    <select id="role_type" class="form-control" type="text" formControlName="role_type"
                        [ngClass]="{'is-invalid' : formErrors.role_type}">
                        <option [value]="''" disabled>Select Type</option>
                        <option [value]="'MSP'">MSP</option>
                        <option [value]="'Tenant'">Tenant</option>
                    </select>
                    <div class="invalid-feedback" *ngIf="formErrors.type">
                        {{formErrors.role_type}}</div>
                </div> -->
                <div class="form-group">
                    <label class="form-col-form-label">Users<em>*</em></label>
                    <input id="users" class="form-control" autocomplete="off" placeholder="Type Username or Email"
                        [class.is-invalid]="formErrors.users" formControlName="users" [typeahead]="filteredUserList"
                        typeaheadOptionField="full_name" (typeaheadOnSelect)="typeaheadOnSelect($event)"
                        (typeaheadNoResults)="typeaheadNoResults($event)">
                    <div class="alert alert-secondary" *ngIf="noUsers">No Results Found</div>
                    <div *ngIf="selectedUsers.length">
                        <span *ngFor="let user of selectedUsers; let i = index;"
                            class="badge badge-pill badge-secondary font-xs py-1 my-2 mx-1">
                            {{user['full_name']}}
                            <span class="fas fa-times pointer-link pl-1" (click)="manageSelectedUsers(i)"></span>
                        </span>
                    </div>
                    <div class="invalid-feedback" *ngIf="formErrors.users">{{formErrors.users}}
                    </div>
                </div>
            </form>
        </div>
        <div class="card-footer p-2">
            <button class="btn btn-outline-danger w-17 pull-right ml-2" type="button"
                (click)="modalRef.hide()">Cancel</button>
            <button class="btn btn-primary w-17 pull-right" type="button" (click)="submitForm()">Submit</button>
        </div>
    </div>
</ng-template>
