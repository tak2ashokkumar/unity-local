<div class="card round-edge">
    <div class="card-header bg-white d-flex justify-content-between align-items-center pl-0 py-2">
        <div class="d-flex align-items-center justify-content-center">
            <span class="badge bg-secondary user-count font-weight-bold ml-3 mt-1 rounded-3">{{count}}</span>
            <span class="ml-2 font-weight-bold mt-1">Users</span>
        </div>
        <div class="d-flex align-items-center justify-content-end">
            <button class="btn btn-primary btn-sm mr-2" (click)="import()" accessControl moduleName="User Management"
                accessType="write" elementType="btn">
                <i class="fas fa-user-plus"></i> &nbsp;Import User </button>
            <button class="action-icons fas fa-plus" tooltip="Create User" (click)="add()" accessControl
                moduleName="User Management" accessType="write" elementType="btn"></button>
            <data-refresh-btn [page]="currentCriteria.pageNo" (refresh)="refreshData($event)"></data-refresh-btn>
        </div>
    </div>
    <div class="card-body pt-0">
        <div class="row mt-3">
            <div class="col-2">
                <table-search-box (searched)="onSearched($event)"></table-search-box>
            </div>
            <div class="col-10">
                <div class="row justify-content-end">
                    <div class="col-2">
                        <select class="form-control form-control-sm" type="text"
                            [(ngModel)]="currentCriteria.params[0].type" (ngModelChange)="onFilterChange()">
                            <option [value]="''">Select Type</option>
                            <option [value]="'MSP'">MSP</option>
                            <option [value]="'Tenant'">Tenant</option>
                        </select>
                    </div>
                    <div class="col-2">
                        <select class="form-control form-control-sm" type="text"
                            [(ngModel)]="currentCriteria.params[0].is_active" (ngModelChange)="onFilterChange()">
                            <option [value]="''">Select Status</option>
                            <option [value]="'True'">Enabled</option>
                            <option [value]="'False'">Disabled</option>
                        </select>
                    </div>
                    <div class="col-2">
                        <div class="form-group">
                            <multiselect-dropdown class="form-control p-0" style="height:auto;" [options]="tenantList"
                                [settings]="tenantListSettings" [(ngModel)]="currentCriteria.multiValueParam.tenants"
                                [texts]="tenantSelectionTexts"
                                (dropdownClosed)="onFilterChange()"></multiselect-dropdown>
                        </div>
                    </div>
                    <div class="mx-2">
                        <table-page-size [currentPageSize]="currentCriteria.pageSize" [totalCount]="count"
                            (pageSizeChange)="pageSizeChange($event)"></table-page-size>
                    </div>
                </div>
            </div>
        </div>
        <table class="table text-left" sortableTable (sorted)="onSorted($event)">
            <thead class="bg-light">
                <tr>
                    <th>Name</th>
                    <th>Email ID</th>
                    <th>Type</th>
                    <th>Tenant</th>
                    <!-- <th>Contact Number</th> -->
                    <th>Role Assigned</th>
                    <th class="text-center">Status</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let view of viewData; let i = index" truncateText>
                    <td class="text-primary tdw-15">
                        <div [tooltip]="view.fullName">{{view.fullName}}</div>
                    </td>
                    <td class="tdw-25">
                        <div [tooltip]="view.email">{{view.email}}</div>
                    </td>
                    <td class="tdw-10">
                        <div [tooltip]="view.type">{{view.type}}</div>
                    </td>
                    <td class="tdw-20">
                        <div [tooltip]="view.tenant">
                            <span>{{view.tenant}}</span>
                            <span *ngIf="view.tenantsBadgeCount"
                                class="badge bg-secondary group-count rounded-3 w-auto ml-1" [popover]="popTemplate"
                                container="body" (click)="showTenants(view)"
                                [outsideClick]="true">+{{view.tenantsBadgeCount}}</span>
                        </div>
                    </td>
                    <!-- <td class="tdw-10">
                        <div [tooltip]="view.contactNumber">{{view.contactNumber}}</div>
                    </td> -->
                    <td class="tdw-25">
                        <div [tooltip]="view.role">
                            <span>{{view.role}}</span>
                            <span *ngIf="view.rolesBadgeCount"
                                class="badge bg-secondary group-count rounded-3 w-auto ml-1" [popover]="popTemplate"
                                container="body" (click)="showRoles(view)"
                                [outsideClick]="true">+{{view.rolesBadgeCount}}</span>
                        </div>
                    </td>
                    <td class="tdw-5">
                        <div class="fas" [tooltip]="view.statusIconMessage" [ngClass]="view.statusIcon"></div>
                    </td>
                    <td class="action-icons-column text-center">
                        <button class="action-icons mb-0 fas fa-paper-plane font-sm ml-1"
                            [tooltip]="view.resetButtonMessage" [ngClass]="view.resetButtonClass"
                            (click)="resetPassword(view)" accessControl moduleName="User Management" accessType="write"
                            elementType="actionbtn"></button>
                        <button class="action-icons mb-0 font-sm ml-1" [class]="view.toggleIconClass"
                            [tooltip]="view.toggleIconMessage" (click)="toggle(view)" accessControl
                            moduleName="User Management" accessType="write" elementType="actionbtn"></button>
                        <button class="action-icons mb-0 fas fa-pencil-alt font-sm ml-1" tooltip="Edit"
                            (click)="edit(view)" accessControl moduleName="User Management" accessType="write"
                            elementType="actionbtn"></button>
                        <button class="action-icons mb-0 fas fa-trash-alt font-sm ml-1" tooltip="Delete"
                            (click)="delete(view)" accessControl moduleName="User Management" accessType="write"
                            elementType="actionbtn"></button>
                    </td>
                </tr>
            </tbody>
        </table>
        <table-entries [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize" [totalCount]="count">
        </table-entries>
        <table-pager *ngIf="viewData.length" [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize"
            [totalCount]="count" (pageChange)="pageChange($event)"></table-pager>
        <div *ngIf="!viewData.length" class="d-flex py-5 justify-content-center align-items-center">
            No users available.
        </div>
    </div>
</div>

<ng-template #confirm>
    <div class="card round-edge mb-0">
        <div class="card-body text-center pb-2">
            <div>Are you sure you want to {{action}}?</div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-center border-top-0">
            <button class="btn btn-sm btn-pill btn-warning mr-2" type="button"
                (click)="manageUser()">{{buttonMessage}}</button>
            <button class="btn btn-sm btn-pill btn-outline-warning" type="button"
                (click)="modalRef.hide()">Cancel</button>
        </div>
    </div>
</ng-template>

<ng-template #popTemplate>
    <div *ngFor="let name of popOverList">{{name}}</div>
</ng-template>
