<div class="card round-edge mb-0 w-100 equalize-card">
    <app-spinner [name]="'dashboard-logs'"></app-spinner>
    <div class="card-header bg-transparent px-3 py-2 d-flex justify-content-between align-items-center">
        <div class="font-500">Activity</div>
        <div class="d-flex align-items-center">
            <data-refresh-btn (refresh)="refreshData()"></data-refresh-btn>
            <button class="btn btn-primary btn-sm ml-2" (click)="goToActivityLogs()"
            accessControl moduleName="Activity Log"
                accessType="read" elementType="btn">View More</button>
        </div>
    </div>
    <div class="card-body px-2 py-0 my-2"
        style="min-height:350px;max-height:400px;overflow-y: auto;overflow-x: hidden;">
        <div class="timeline">
            <div class="timeline-item" *ngFor="let view of viewData; let l = last;">
                <div class="timeline-icon">
                    <span class="badge">
                        <button class="action-icons mb-0 font-sm nopointerevents" [ngClass]="view.iconByAction"></button>
                    </span>
                </div>
                <div class="timeline-content">
                    <div class="card" [ngClass]="l ? 'mb-0' : 'mb-2'">
                        <div class="card-body d-flex flex-column p-1 px-2">
                            <div class="font-sm">{{view.action}}</div>
                            <div class="d-flex justify-content-between">
                                <div class="font-xs-sm text-truncate">By: <span class="">{{view.actorName}}</span></div>
                                <div class="text-truncate">
                                    <i class="far fa-clock font-xs-sm"></i>
                                    <span class="text-muted ml-1 font-xs-sm">{{view.actionTime}}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
