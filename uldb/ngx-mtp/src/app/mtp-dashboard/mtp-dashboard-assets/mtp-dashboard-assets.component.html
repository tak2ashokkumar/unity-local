<div class="card round-edge mb-0 w-100 equalize-card">
    <app-spinner [name]="'dashboard-assets'"></app-spinner>
    <div class="card-header bg-transparent px-3 py-2 font-500">Total Assets</div>
    <div class="card-body px-2 py-0" style="min-height:350px;max-height:400px;overflow-y: auto;overflow-x: hidden;">
        <div class="row my-2">
            <div class="col-3 text-center">
                <div class="card round-edge mb-0">
                    <div class="card-body d-flex flex-column px-2 py-1">
                        <div class="font-xs font-500 text-muted text-truncate">Total Assets</div>
                        <span class="text-primary font-lg font-500">{{summaryView?.total}}</span>
                    </div>
                </div>
            </div>
            <div class="col-3 text-center">
                <div class="card round-edge mb-0">
                    <div class="card-body d-flex flex-column px-2 py-1">
                        <div class="font-xs font-500 text-muted text-truncate ml-1">Up</div>
                        <div class="d-flex justify-content-center align-items-center">
                            <span class="fas fa-long-arrow-alt-up text-success font-lg"></span>
                            <span class="text-primary font-500 font-lg ml-1"> {{summaryView?.up}} </span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-3 text-center">
                <div class="card round-edge mb-0">
                    <div class="card-body d-flex flex-column px-2 py-1">
                        <div class="font-xs font-500 text-muted text-truncate ml-1">Down</div>
                        <div class="d-flex justify-content-center align-items-center">
                            <span class="fas fa-long-arrow-alt-down text-danger font-lg"></span>
                            <span class="text-primary font-500 font-lg ml-1"> {{summaryView?.down}} </span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-3 text-center">
                <div class="card round-edge mb-0">
                    <div class="card-body d-flex flex-column px-2 py-1">
                        <div class="font-xs font-500 text-muted text-truncate">Unknown</div>
                        <div class="d-flex justify-content-center align-items-center">
                            <span class="text-primary font-500 font-lg ml-1"> {{summaryView?.unknown}} </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <table class="table table-sm font-xs-sm font-500">
            <thead>
                <tr>
                    <th>Device Type</th>
                    <th>Up</th>
                    <th>Down</th>
                    <th>UnKnown</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let view of viewData" truncateText>
                    <td class="tdw-40">
                        <div>
                            <i class="fa fas" [ngClass]="view.iconClass"></i>
                            <span class="ml-1">{{view.displayType}}</span>
                        </div>
                    </td>
                    <td class="tdw-15">
                        <div class="text-success">{{view.up}}</div>
                    </td>
                    <td class="tdw-15">
                        <div class="text-danger">{{view.down}}</div>
                    </td>
                    <td class="tdw-15">
                        <div class="text-muted">{{view.unknown}}</div>
                    </td>
                    <td class="tdw-15">
                        <div class="">{{view.total}}</div>
                    </td>
                </tr>
