<ng-container>
    <div class="row mt-2" *ngIf="mapService.shouldShowMapWidgets()">
        <div class="col">
            <mtp-dashboard-map></mtp-dashboard-map>
        </div>
    </div>
    
    <div class="row mt-2">
        <div class="col pr-0">
            <mtp-dashboard-assets></mtp-dashboard-assets>
        </div>
        <div class="col pr-0">
            <mtp-dashboard-alerts></mtp-dashboard-alerts>
        </div>
        <div class="col">
            <mtp-dashboard-subscriptions></mtp-dashboard-subscriptions>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-8 pr-1">
            <mtp-dashboard-recent-alerts></mtp-dashboard-recent-alerts>
        </div>
        <div class="col-4 pl-1">
            <mtp-dashboard-activity></mtp-dashboard-activity>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col">
            <mtp-dashboard-tickets></mtp-dashboard-tickets>
        </div>
    </div>
</ng-container>
