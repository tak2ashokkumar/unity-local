<div class="card  round-edge">
    <div class="card-header bg-white border-0 d-flex justify-content-between">

        <div class="d-flex justify-content-start align-items-center">
            <img *ngIf="tenantInfo.logo" class="mt-1 mr-2" [src]="tenantInfo.logo" alt="logo"
                style="height: 80px;width:80px">
            <div class="d-flex flex-column">
                <h4 class="mb-0 float-left text-dark mb-1">{{tenantInfo.name}}</h4>
                <span class="text-muted font-sm font-500 mb-1">
                    <span *ngIf="tenantInfo.address1">{{tenantInfo.address1}},</span>
                    <span *ngIf="tenantInfo.location" class="ml-2">{{tenantInfo.location}}</span>
                    <!-- <span *ngIf="tenantInfo.city" class="ml-2">{{tenantInfo.city}},</span>
                    <span *ngIf="tenantInfo.state" class="ml-2">{{tenantInfo.state}},</span>
                    <span *ngIf="tenantInfo.postalCode" class="ml-2">{{tenantInfo.postalCode}}</span> -->
                </span>
                <div class="font-500">
                    <span *ngIf="tenantInfo.phone">
                        <i class="fas fa-phone-alt text-muted"></i>
                        <span class="ml-3 mr-4 mt-2 text-muted font-sm">{{tenantInfo.phone}}</span>
                    </span>
                    <span *ngIf="tenantInfo.email">
                        <i class="fas fa-envelope text-muted"></i>
                        <span class="ml-3 text-muted font-sm">{{tenantInfo.email}}</span>
                    </span>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-between">
            <button class="action-icons fas font-sm" [tooltip]="tenantInfo.toggleTootipMsg"
                [ngClass]="tenantInfo.toggleIcon" (click)="toggleTenant(tenantInfo)" accessControl
                moduleName="Tenant Management" accessType="write" elementType="btn"></button>
            <button class="action-icons fas fa-pencil-alt font-sm mx-1" tooltip="Edit"
                (click)="goToEditTenant(tenantInfo)" accessControl moduleName="Tenant Management" accessType="write"
                elementType="btn"></button>
            <button class="action-icons mr-3 far fa-trash-alt font-sm d-inline" tooltip="Delete"
                (click)="deleteTenant(tenantInfo)" accessControl moduleName="Tenant Management" accessType="write"
                elementType="btn"></button>
            <!-- (click)="goToEditTenant(tenantInfo)"></button> -->
            <!-- <button class="action-icons mr-3 far fa-trash-alt font-sm d-inline" tooltip="Delete"
                (click)="deleteTenant()"></button> -->
        </div>
    </div>
    <div class="card-body pt-0">
        <div class="card border-0 pb-0">
            <div class="card-header bg-white pb-0">
                <ul class="nav">
                    <li class="nav-item text-muted" *ngFor="let tab of tabItems">
                        <a class="nav-link pt-0 pb-0" [ngClass]="isActive(tab)" (click)="goTo(tab)">
                            <h5>{{tab.name}}</h5>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <router-outlet></router-outlet>
    </div>
</div>

<ng-template #deleteConfirmTenant>
    <div class="card round-edge mb-0">
        <div class="card-body text-center pb-2">
            <div>Are you sure you want to delete {{tenantName}} ?</div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-center border-top-0">
            <button class="btn btn-sm btn-pill btn-warning mr-2" type="button" (click)="confirmDelete()">Delete</button>
            <button class="btn btn-sm btn-pill btn-outline-warning" type="button"
                (click)="deleteTenantModalRef.hide()">Cancel</button>
        </div>
    </div>
</ng-template>

<ng-template #toggleConfirmTenant>
    <div class="card round-edge mb-0">
        <div class="card-body text-center pb-2">
            <div>Are you sure you want to {{tennantToggleInfo.toggleTootipMsg}} {{tennantToggleInfo.name}} ?</div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-center border-top-0">
            <button class="btn btn-sm btn-pill btn-warning mr-2" type="button"
                (click)="confirmToggleTennat()">{{tennantToggleInfo.toggleTootipMsg}}</button>
            <button class="btn btn-sm btn-pill btn-outline-warning" type="button"
                (click)="toggleTenantModalRef.hide()">Cancel</button>
        </div>
    </div>
</ng-template>
