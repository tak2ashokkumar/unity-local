<div class="input-prepend input-group custom-input-group">
    <div class="input-group-prepend">
        <span class="input-group-text bg-transparent border-right-0">
            <i class="fa fa-search"></i>
        </span>
    </div>
    <input placeholder="Enter keyword"
        class="form-control  form-control-sm border-left-0 border-right-0 custom-search-input" id="prependedInput"
        size="16" type="text" [ngModel]="searchValue" (ngModelChange)="onSearched($event)">
    <div class="input-group-append" (click)="onSearched('')">
        <span class="input-group-text bg-transparent">
            <i class="fas fa-times-circle"></i>
        </span>
    </div>
</div>
