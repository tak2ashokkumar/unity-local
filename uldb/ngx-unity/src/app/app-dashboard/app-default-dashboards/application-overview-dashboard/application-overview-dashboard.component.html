<div class="card-header bg-white border-bottom-0 py-2 d-flex justify-content-between align-items-center">
    <ng-container *ngIf="applications?.length">
        <div class="d-flex align-items-center w-50">
            <a class="nav-link tabs-level1-link border-0 text-success">Application Dashboard - </a>
            <select class="ml-2 form-control w-30" [(ngModel)]="selectedApplication">
                <option *ngFor="let app of applications" [ngValue]="app">{{app.displayName}}</option>
            </select>
        </div>
    </ng-container>
    <ng-container class="w-20"
        *ngIf="selectedApplication && selectedApplication.displayName=='AstronomyShop' && selectedApplication.id">
        <button class="btn btn-pill btn-warning btn-sm ml-2" type="button" (click)="goToExectiveAiSummary()"
            container="body">Executive AI Summary</button>
    </ng-container>
    <div class="d-flex justify-content-end align-items-center w-30">
        <ng-container *ngIf="dateDropdownOptions">
            <custom-date-dropdown [options]="dateDropdownOptions.options" [enableCustomDateRange]="false"
                [customClass]="'form-control-sm'" [default]="dateDropdownOptions.defaultSelected"
                (onSubmit)="onFilterChange($event)">
            </custom-date-dropdown>
        </ng-container>
        <button class="btn btn-pill btn-warning pull-right btn-sm ml-2" type="button" (click)="goBack()"
            [tooltip]="'Go Back'" container="body">
            <i class="fa fa-arrow-left"></i>
        </button>
        <!-- <data-refresh-btn (refresh)="refreshData()"></data-refresh-btn> -->
    </div>
</div>

<ng-container *ngIf="applications?.length && selectedApplication">
    <div [ngSwitch]="selectedApplication.displayName">
        <div *ngSwitchCase="'AstronomyShop'">
            <astronomy-shop-application-dashboard [appId]="selectedApplication.id"
                [filters]="dateDropdownOptions?.formData"></astronomy-shop-application-dashboard>
        </div>
        <div *ngSwitchCase="'Bank of Anthos'">
            <bank-of-anthos-application-dashboard [appId]="selectedApplication.id"
                [filters]="dateDropdownOptions?.formData"></bank-of-anthos-application-dashboard>
        </div>
        <ng-container *ngSwitchCase="'EasyTrade'">
            <easy-trade-application-dashboard [appId]="selectedApplication.id"
                [filters]="dateDropdownOptions?.formData"></easy-trade-application-dashboard>
        </ng-container>
    </div>
</ng-container>

<ng-container *ngIf="!applications?.length">
    <div class="card-body d-flex justify-content-center align-items-center h-100" style="min-height: 240px;">
        No Applications found.
    </div>
</ng-container>
