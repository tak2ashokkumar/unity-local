<div class="storage-dashboard-shell">
    <div class="storage-dashboard-topbar">
        <div class="storage-dashboard-heading">
            <div class="storage-dashboard-title-row">
                <span class="storage-dashboard-title">Storage Dashboard -</span>
                <select class="form-control form-control-sm storage-type-select" [value]="selectedStorage"
                    aria-label="Storage type" (change)="onStorageChange($event.target.value)">
                    <option value="netapp">NetApp</option>
                    <option value="pure">Pure</option>
                </select>
            </div>
            <div class="storage-dashboard-subtitle">
                Refreshed: {{refreshedText || 'Loading'}} | Scope: Datacenter:
                <ng-container
                    *ngTemplateOutlet="filterScopeSummaryTmpl; context: { summary: datacenterScopeSummary }">
                </ng-container>
                <span class="scope-separator">|</span>
                {{storageItemScopeLabel}}:
                <ng-container
                    *ngTemplateOutlet="filterScopeSummaryTmpl; context: { summary: storageItemScopeSummary }">
                </ng-container>
            </div>
        </div>

        <form class="storage-dashboard-filters" *ngIf="filterForm" [formGroup]="filterForm">
            <app-spinner [name]="filterLoaderName" [width]="0"></app-spinner>
            <div class="storage-filter-control">
                <label>Datacenter</label>
                <select class="form-control form-control-sm" formControlName="datacenter"
                    (change)="onDatacenterChange()">
                    <option *ngFor="let datacenter of datacenterOptions; trackBy: trackByOption"
                        [value]="datacenter.value">
                        {{datacenter.label}}
                    </option>
                </select>
            </div>

            <ng-container [ngSwitch]="selectedStorage">
                <div class="storage-filter-control storage-multiselect-control" *ngSwitchCase="'netapp'">
                    <label>Cluster Name</label>
                    <multiselect-dropdown [options]="clusterOptions" [settings]="clusterMultiselectSettings"
                        [texts]="clusterMultiselectTexts" class="form-control p-0 storage-dashboard-multiselect"
                        formControlName="clusters" (dropdownClosed)="onClustersChange()">
                    </multiselect-dropdown>
                </div>

                <div class="storage-filter-control storage-multiselect-control" *ngSwitchCase="'pure'">
                    <label>Arrays Overview</label>
                    <multiselect-dropdown [options]="arrayOptions" [settings]="arrayMultiselectSettings"
                        [texts]="arrayMultiselectTexts" class="form-control p-0 storage-dashboard-multiselect"
                        formControlName="arrays" (dropdownClosed)="onArraysChange()">
                    </multiselect-dropdown>
                </div>
            </ng-container>

            <div class="storage-filter-control storage-time-range-control">
                <label>Time Range</label>
                <custom-date-dropdown [options]="timeRangeOptions" [enableCustomDateRange]="true"
                    [customClass]="'form-control-sm'" [default]="selectedTimeRange" [viewportSafePopup]="true"
                    [emitOnInit]="false" [emitOnExternalChanges]="false" (onSubmit)="onTimeRangeChange($event)">
                </custom-date-dropdown>
            </div>

            <button class="storage-round-action-btn" type="button" (click)="applyFilters()"
                [disabled]="reloadButtonsDisabled" [tooltip]="'Apply Filters'" container="body"
                aria-label="Apply storage dashboard filters">
                <i class="fa fa-filter"></i>
            </button>

            <span class="storage-dashboard-action-separator"></span>

            <div class="storage-dashboard-actions">
                <button class="storage-round-action-btn" type="button" (click)="refreshData()"
                    [disabled]="reloadButtonsDisabled" [tooltip]="'Reset Filters'" container="body"
                    aria-label="Reset storage dashboard filters">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="storage-round-action-btn" type="button" (click)="goBack()" [tooltip]="'Go Back'"
                    container="body" aria-label="Go back">
                    <i class="fa fa-arrow-left"></i>
                </button>
            </div>
        </form>
    </div>

    <ng-template #filterScopeSummaryTmpl let-summary="summary">
        <span class="scope-summary">
            <span>{{summary.primaryLabel}}</span>
            <span class="scope-more-count" *ngIf="summary.remainingLabels.length" [popover]="scopePopoverTmpl"
                [popoverContext]="{ labels: summary.remainingLabels }" triggers="mouseenter:mouseleave"
                placement="bottom" container="body">
                +{{summary.remainingLabels.length}}
            </span>
        </span>
    </ng-template>

    <ng-template #scopePopoverTmpl let-labels="labels">
        <div class="scope-popover-list">
            <div class="scope-popover-item" *ngFor="let label of labels; trackBy: trackByIndex">{{label}}</div>
        </div>
    </ng-template>

    <div class="storage-dashboard-content" *ngIf="appliedFilters">
        <ng-container [ngSwitch]="appliedFilters.storageType">
            <netapp-storage-dashboard *ngSwitchCase="'netapp'" [filters]="appliedFilters" [refreshToken]="refreshToken"
                [filtersUnavailable]="filterOptionsUnavailable">
            </netapp-storage-dashboard>
            <pure-storage-dashboard *ngSwitchCase="'pure'" [filters]="appliedFilters" [refreshToken]="refreshToken"
                [filtersUnavailable]="filterOptionsUnavailable">
            </pure-storage-dashboard>
        </ng-container>
    </div>
</div>
