<ng-template #authModal>

  <div class="modal-header">
    <h5 class="modal-title">Connect to Device</h5>
    <button type="button" class="close" (click)="close()">
      <span>&times;</span>
    </button>
  </div>

  <div class="modal-body">

    <form [formGroup]="authForm">

      <div class="form-group">
        <label>OS/Connection Type</label>
        <select class="form-control" formControlName="connection_type">
          <option value="ssh">Linux / SSH</option>
          <option value="ssh">MacOS / SSH</option>
          <option value="winrm">Windows / WinRM</option>
          <option [value]="databaseConnectionType">Database</option>
        </select>
        <div class="text-danger">{{formErrors.connection_type}}</div>
      </div>

      <div class="form-group" *ngIf="isDatabase">
        <label>DB Engine</label>
        <select class="form-control" formControlName="engine">
          <option value="" disabled>Select DB Engine</option>
          <option *ngFor="let engine of databaseEngineOptions" [value]="engine.value">
            {{engine.label}}
          </option>
        </select>
        <div class="text-danger">{{formErrors.engine}}</div>
      </div>

      <!-- Host -->
      <div class="form-group">
        <label>Host</label>
        <ng-select [items]="hosts" formControlName="host" placeholder="Select or enter Host" [multiple]="false"
          [closeOnSelect]="true" [hideSelected]="false" [addTag]="addCustomValue('host')"
          [class.is-invalid]="formErrors.host">
        </ng-select>
        <div class="text-danger">{{formErrors.host}}</div>
      </div>

      <!-- Port -->
      <div class="form-group">
        <label>Port</label>
        <input type="number" class="form-control" formControlName="port">
        <div class="text-danger">{{formErrors.port}}</div>
      </div>

      <div class="form-group" *ngIf="isDatabase">
        <label>Database name</label>
        <input class="form-control" formControlName="database">
        <div class="text-danger">{{formErrors.database}}</div>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label>Username</label>
        <input class="form-control" formControlName="username">
        <div class="text-danger">{{formErrors.username}}</div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" formControlName="password">
        <div class="text-danger">{{formErrors.password}}</div>
      </div>

      <!-- Windows-only fields -->
      <ng-container *ngIf="isWindows">
        <div class="form-group">
          <label>Transport</label>
          <select class="form-control" formControlName="transport">
            <option value="ntlm">NTLM</option>
            <option value="plaintext">Plaintext</option>
            <option value="ssl">SSL</option>
          </select>
        </div>

        <div class="form-group">
          <label>Shell</label>
          <select class="form-control" formControlName="shell">
            <option value="cmd">CMD</option>
            <option value="powershell">PowerShell</option>
          </select>
        </div>
      </ng-container>

      <!-- Collector -->
      <div class="form-group" formGroupName="collector">
        <label class="font-col-form-label" for="collectorid">Collector</label>
        <select id="collectoruuid" class="form-control" formControlName="uuid"
          [class.is-invalid]="formErrors.collector.uuid">
          <option value="">Select Collector</option>
          <option *ngFor="let collector of collectors" [value]="collector.uuid">
            {{collector.name}}
          </option>
        </select>
        <div class="invalid-feedback" *ngIf="formErrors.collector.uuid">
          {{formErrors.collector.uuid}}
        </div>
      </div>

      <div class="text-danger">{{formErrors.invalidCred}}</div>

      <div class="form-group form-check mt-2" *ngIf="showMakeDefaultCheckbox">
        <input id="makeDefaultForCondition" type="checkbox" class="form-check-input"
          formControlName="make_default_for_condition">
        <label class="form-check-label" for="makeDefaultForCondition">
          Make this device default for this condition
        </label>
      </div>
    </form>

  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="close()">Close</button>
    <button class="btn btn-success" (click)="onSubmit()">Connect</button>
  </div>

</ng-template>
