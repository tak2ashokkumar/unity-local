<div class="remote-web-viewer">
  <div class="viewer-toolbar">
    <div class="viewer-title">
      <span>UnityOne Remote Web Viewer</span>
      <small>{{statusLabel}} · {{connectionStatus}}</small>
    </div>

    <div class="viewer-metrics">
      <span class="viewer-pill">{{durationLabel}}</span>
      <span class="viewer-pill viewer-pill-warning" *ngIf="idleWarningMessage">{{idleWarningMessage}}</span>
      <span class="viewer-pill viewer-pill-warning" *ngIf="reconnectMessage">{{reconnectMessage}}</span>
    </div>

    <div class="viewer-actions">
      <button class="viewer-icon-button" type="button" (click)="returnToSource()" [title]="returnLabel">
        <i class="fas fa-arrow-left"></i>
      </button>
      <button class="viewer-icon-button" type="button" (click)="toggleFullscreen()" title="Full screen">
        <i class="fas" [ngClass]="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
      </button>
      <button class="viewer-icon-button" type="button" (click)="retry()" [disabled]="isClosing || state === 'authorizing'" title="Reconnect">
        <i class="fas fa-sync-alt"></i>
      </button>
      <button class="viewer-icon-button" type="button" (click)="openInNewTab()" *ngIf="!terminalState" title="Open in new tab">
        <i class="fas fa-external-link-alt"></i>
      </button>
      <button class="viewer-end-button" type="button" (click)="endSession()" [disabled]="isClosing || state === 'terminated'">
        End Session
      </button>
    </div>
  </div>

  <div class="viewer-tabs" *ngIf="tabs.length > 1">
    <div class="viewer-tab" *ngFor="let tab of tabs; let i = index"
      [class.viewer-tab-active]="tab.active" (click)="switchTab(i)" [title]="tab.title">
      <span class="viewer-tab-title">{{tab.title}}</span>
      <button type="button" class="viewer-tab-close" (click)="closeTab(i, $event)" title="Close tab">&times;</button>
    </div>
  </div>

  <div class="viewer-error" *ngIf="errorMessage">
    {{errorMessage}}
  </div>

  <div #viewport class="viewer-viewport" tabindex="0"
    [class.viewer-viewport-disabled]="!canSendInput"
    [style.cursor]="canSendInput ? remoteCursor : 'not-allowed'"
    (mousedown)="onMouseEvent($event, 'mousedown')"
    (mouseup)="onMouseEvent($event, 'mouseup')"
    (mousemove)="onMouseEvent($event, 'mousemove')"
    (wheel)="onWheel($event)"
    (contextmenu)="$event.preventDefault()">
    <textarea #keyboardCapture
      class="viewer-keyboard-capture"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      tabindex="0"
      aria-label="Remote keyboard input"
      (keydown)="onKeyboardEvent($event, 'keydown')"
      (keyup)="onKeyboardEvent($event, 'keyup')"
      (paste)="onPasteEvent($event)"></textarea>
    <div class="viewer-context-menu" *ngIf="contextMenu"
      [style.left.px]="contextMenu.x" [style.top.px]="contextMenu.y"
      (mousedown)="$event.stopPropagation()" (mouseup)="$event.stopPropagation()"
      (mousemove)="$event.stopPropagation()" (contextmenu)="$event.stopPropagation(); $event.preventDefault()">
      <button type="button" *ngIf="contextMenu.link" (click)="contextOpenLinkInNewTab()">Open link in new tab</button>
      <button type="button" *ngIf="contextMenu.link" (click)="contextOpenLink()">Open link in this tab</button>
      <button type="button" *ngIf="contextMenu.link" (click)="contextCopy(contextMenu.link)">Copy link address</button>
      <button type="button" *ngIf="contextMenu.text" (click)="contextCopy(contextMenu.text)">Copy selected text</button>
      <button type="button" (click)="contextNav('back')">Back</button>
      <button type="button" (click)="contextNav('forward')">Forward</button>
      <button type="button" (click)="contextNav('reload')">Reload</button>
    </div>
    <img *ngIf="frameUrl" class="viewer-frame" [src]="frameUrl" alt="Remote browser display" draggable="false">
    <pre *ngIf="!frameUrl && textFrame" class="viewer-text">{{textFrame}}</pre>
    <div *ngIf="!frameUrl && !textFrame" class="viewer-empty">
      <div class="viewer-empty-status">{{statusLabel}}</div>
      <div class="viewer-empty-detail">{{connectionStatus}}</div>
    </div>
  </div>
</div>
