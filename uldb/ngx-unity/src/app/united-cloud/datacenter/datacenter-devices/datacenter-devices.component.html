<div class="card rounded-0 border-top-0">
  <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-2">
    <div class="d-flex justify-content-center align-items-center font-500">
      <span class="badge badge-secondary font-sm">{{count}}</span>
      <span class="ml-1 font-lg">{{title}}</span>
    </div>
    <div class="d-flex justify-content-end align-items-center">
      <data-refresh-btn [page]="currentCriteria.pageNo" (refresh)="refreshData($event)"></data-refresh-btn>
    </div>
  </div>
  <div class="card-body py-2">
    <div class="row mx-0 d-flex justify-content-between align-items-center pb-2">
      <div class="w-25">
        <search-box [searchValue]="currentCriteria.searchValue" (searched)="onSearched($event)"></search-box>
      </div>
      <div>
        <table-page-size [currentPageSize]="currentCriteria.pageSize" [totalCount]="count"
          (pageSizeChange)="pageSizeChange($event)"></table-page-size>
      </div>
    </div>
    <table class="table table-sm text-left" sortableTable (sorted)="onSorted($event)" *ngIf="viewData.length">
      <thead class="bg-light">
        <tr>
          <ng-container *ngFor="let column of columns">
            <th *ngIf="column.sortColumn" [sortable-column]="column.sortColumn">{{column.label}}</th>
            <th *ngIf="!column.sortColumn">{{column.label}}</th>
          </ng-container>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let view of viewData" setTableColumnWidth>
          <td *ngFor="let column of columns">
            <shared-device-status *ngIf="column.type == 'status'" [status]="getStatusValue(view, column)">
            </shared-device-status>
            <ng-container *ngIf="column.type == 'tags'" [ngTemplateOutlet]='tagsList'
              [ngTemplateOutletContext]="{tags:getTags(view, column)}"></ng-container>
            <div *ngIf="!column.type || column.type == 'text'" [tooltip]="getColumnValue(view, column)"
              container="body">
              {{getColumnValue(view, column)}}
            </div>
          </td>
          <td class="action-icons-column">
            <ng-container *ngFor="let action of actions">
              <button *ngIf="action.moduleName" class="action-icons mb-0 font-sm ml-1" [class]="action.icon"
                [tooltip]="getActionTooltip(action, view)"
                [ngClass]="{'action-icons-disabled': isActionDisabled(action, view)}"
                (click)="onAction(action, view)" accessControl [moduleName]="action.moduleName"
                [accessType]="action.accessType" elementType="actionbtn"
                [modulePermissions]="view.applicableModulePermissions"></button>
              <button *ngIf="!action.moduleName" class="action-icons mb-0 font-sm ml-1" [class]="action.icon"
                [tooltip]="getActionTooltip(action, view)"
                [ngClass]="{'action-icons-disabled': isActionDisabled(action, view)}"
                (click)="onAction(action, view)"></button>
            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>
    <table-entries [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize" [totalCount]="count">
    </table-entries>
    <table-pager *ngIf="viewData.length" [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize"
      [totalCount]="count" (pageChange)="pageChange($event)"></table-pager>
    <div class="text-center text-muted py-4" *ngIf="!viewData.length">No associated {{title}} were found.</div>
  </div>
</div>

<ng-template #tagsList let-tags="tags">
  <div [popoverContext]="{ tags: tags }" [popover]="tagsTooltipTmpl" triggers="mouseenter:mouseleave" placement="top"
    container="body">
    <span *ngFor="let tag of tags" class="badge badge-pill badge-primary">{{getTagLabel(tag)}}</span>
  </div>
  <div *ngIf="!tags.length">N/A</div>
</ng-template>

<ng-template #tagsTooltipTmpl let-tags="tags">
  <div class="font-weight-bold">
    <span *ngFor="let tag of tags" class="badge badge-pill badge-primary m-1 font-sm">{{getTagLabel(tag)}}</span>
  </div>
</ng-template>

<switches-crud *ngIf="deviceType == 'switches'" (onCrud)="onCrud($event)"></switches-crud>
<firewalls-crud *ngIf="deviceType == 'firewalls'" (onCrud)="onCrud($event)"></firewalls-crud>
<loadbalancers-crud *ngIf="deviceType == 'loadbalancers'" (onCrud)="onCrud($event)"></loadbalancers-crud>
<hypervisors-crud *ngIf="deviceType == 'hypervisors'" (onCrud)="onCrud($event)"></hypervisors-crud>
<bm-servers-crud *ngIf="deviceType == 'bmservers'" (onCrud)="onCrud($event)"></bm-servers-crud>
<storage-crud *ngIf="deviceType == 'storagedevices'" (onCrud)="onCrud($event)"></storage-crud>
<device-zabbix-email-notification></device-zabbix-email-notification>
