<div class="row">
    <div class="col-12">
        <div class="card rounded-0 border-top-0">
            <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-2">
                <div class="d-flex justify-content-center align-items-center font-500">
                    <span class="badge badge-secondary font-sm">{{count}}</span>
                    <span class="ml-1 font-lg">Virtual Machines</span>
                </div>
                <div class="d-flex justify-content-end align-items-center">
                    <data-refresh-btn [page]="currentCriteria.pageNo"
                        (refresh)="refreshData($event)"></data-refresh-btn>
                    <button class="btn btn-pill btn-warning btn-sm ml-2" (click)="goBack()" tooltip="Back">
                        <i class="fa fa-arrow-left"></i>
                    </button>
                </div>
            </div>
            <div class="card-body py-2">
                <div class="row mx-0 d-flex justify-content-between align-items-center pb-2">
                    <div class="w-25">
                        <search-box [searchValue]="currentCriteria.searchValue"
                            (searched)="onSearched($event)"></search-box>
                    </div>
                    <div>
                        <table-page-size *ngIf="viewData.length" [currentPageSize]="currentCriteria.pageSize"
                            [totalCount]="count" (pageSizeChange)="pageSizeChange($event)"></table-page-size>
                    </div>
                </div>
                <table class="table table-sm text-left">
                    <thead class="bg-light">
                        <tr>
                            <th class="tdw-25">VM Name</th>
                            <th class="tdw-15 text-center">Power State</th>
                            <th class="tdw-20">Cluster</th>
                            <th class="tdw-20">Host</th>
                            <th class="tdw-10 text-center">vCPU</th>
                            <th class="tdw-10 text-center">RAM (MB)</th>
                            <th class="action-icons-column text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let view of viewData; trackBy: trackByUuid" truncateText>
                            <td class="tdw-25">
                                <button class="btn btn-link text-decoration-none p-0 table-column-btn" type="button"
                                    [tooltip]="view.name" (click)="goToMonitoring(view)" accessControl
                                    moduleName="Monitoring" accessType="View Monitoring"
                                    elementType="div">{{view.name}}</button>
                            </td>
                            <td class="tdw-15 text-center">
                                <span class="{{view.powerStateClass}}">{{view.powerState}}</span>
                            </td>
                            <td class="tdw-20">
                                <div [tooltip]="view.clusterId">{{view.clusterId}}</div>
                            </td>
                            <td class="tdw-20">
                                <div [tooltip]="view.hostId">{{view.hostId}}</div>
                            </td>
                            <td class="tdw-10 text-center">
                                <div>{{view.cpuCores}}</div>
                            </td>
                            <td class="tdw-10 text-center">
                                <div>{{view.ram}}</div>
                            </td>
                            <td class="action-icons-column text-center">
                                <button class="action-icons mb-0 fas fa-chart-area font-sm ml-1" container="body"
                                    tooltip="Monitoring" (click)="goToMonitoring(view)" accessControl
                                    moduleName="Monitoring" accessType="View Monitoring" elementType="actionbtn">
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <table-entries [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize"
                    [totalCount]="count"></table-entries>
                <table-pager *ngIf="viewData.length" [pageNo]="currentCriteria.pageNo"
                    [pageSize]="currentCriteria.pageSize" [totalCount]="count"
                    (pageChange)="pageChange($event)"></table-pager>
                <div class="text-center text-muted py-4" *ngIf="!viewData.length">No associated Virtual Machines found.
                </div>
            </div>
        </div>
    </div>
</div>
