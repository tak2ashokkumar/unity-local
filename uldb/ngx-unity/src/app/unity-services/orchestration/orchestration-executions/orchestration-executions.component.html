<div class="row mt--3" *ngIf="listSummaryViewData && tableData">
  <div class="col-12 p-0">
    <!-- Execution summary: compact bar. Replace the old <div class="execution-summary-row"> block. -->
    <div class="card mb-0">
      <div class="card-body summary-bar d-flex align-items-stretch p-0 px-3">

        <!-- Execution -->
        <div class="d-flex flex-column justify-content-center pr-4">
          <div class="small text-uppercase text-muted font-weight-bold">Execution</div>
          <div class="d-flex align-items-center">
            <span class="d-inline-flex align-items-center mr-3 text-nowrap"
              *ngFor="let val of listSummaryViewData?.total">
              <span class="fa mr-1" [ngClass]="val.icon" [tooltip]="val.tooltipMessage"></span>
              <span class="text-value-sm font-weight-bold pointer-link"
                [ngClass]="getStatusClass(val) || 'summary-num'">{{val.count}}</span>
            </span>
          </div>
        </div>

        <!-- Type: Task | Workflow -->
        <div class="d-flex flex-column justify-content-center px-4 border-left">
          <div class="small text-uppercase text-muted font-weight-bold">Type</div>
          <div class="d-flex align-items-center text-nowrap">
            <span class="small text-muted mr-2">Task</span>
            <span class="d-inline-flex align-items-center mr-3" *ngFor="let val of listSummaryViewData?.type?.task">
              <span class="fa mr-1" [ngClass]="val.icon" [tooltip]="val.tooltipMessage"></span>
              <span class="text-value-sm font-weight-bold pointer-link"
                [ngClass]="getStatusClass(val) || 'summary-num'">{{val.count}}</span>
            </span>

            <span class="border-left pl-3 ml-1 small text-muted mr-2">Workflow</span>
            <span class="d-inline-flex align-items-center mr-3" *ngFor="let val of listSummaryViewData?.type?.workflow">
              <span class="fa mr-1" [ngClass]="val.icon" [tooltip]="val.tooltipMessage"></span>
              <span class="text-value-sm font-weight-bold pointer-link"
                [ngClass]="getStatusClass(val) || 'summary-num'">{{val.count}}</span>
            </span>
          </div>
        </div>

        <!-- Category (+N popover kept) -->
        <div class="d-flex flex-column justify-content-center pl-4 border-left">
          <div class="small text-uppercase text-muted font-weight-bold">Category</div>
          <div class="d-flex align-items-center text-nowrap">
            <ng-container *ngFor="let cat of (listSummaryViewData?.categories | slice:0:2); let i = index">
              <span class="small text-muted mr-2" [ngClass]="{'border-left pl-3 ml-1': i > 0}">{{cat.category}}</span>
              <span class="d-inline-flex align-items-center mr-3" *ngFor="let stat of cat.status">
                <span class="fa mr-1" [ngClass]="stat.icon" [tooltip]="stat.tooltipMessage"></span>
                <span class="text-value-sm font-weight-bold pointer-link"
                  [ngClass]="getStatusClass(stat) || 'summary-num'">{{stat.count}}</span>
              </span>
            </ng-container>
            <!-- everything after the first 2 categories lives in this popover -->
            <span *ngIf="popoverCategories?.length"
              class="badge users-count text-primary ml-1 d-inline-flex align-items-center justify-content-center"
              [popover]="popTemplate" container="body" [outsideClick]="true">{{popoverCategories.length}}</span>
          </div>
        </div>

      </div>
    </div>

    <!-- Popover: fixed height, scrolls when the list is long -->
    <ng-template #popTemplate>
      <div class="category-popover">
        <div class="d-flex align-items-center text-nowrap py-1 border-bottom" *ngFor="let cat of popoverCategories">
          <span class="small text-muted mr-3 flex-grow-1">{{cat.category}}</span>
          <span class="d-inline-flex align-items-center ml-3" *ngFor="let stat of cat.status">
            <span class="fa mr-1" [ngClass]="stat.icon" [tooltip]="stat.tooltipMessage"></span>
            <span class="text-value-sm font-weight-bold"
              [ngClass]="getStatusClass(stat) || 'summary-num'">{{stat.count}}</span>
          </span>
        </div>
      </div>
    </ng-template>

    <div class="col-12 mt-2 p-0">
      <app-generic-table [title]="'Executions'" [count]="count" [searchValue]="currentCriteria.searchValue"
        (searched)="onSearched($event)" (refresh)="refreshData()" [filters]="filterConfig"
        [selectedFilters]="selectedFiltersForTable" (filtersApplied)="onFiltersApplied($event)"
        [pageSize]="currentCriteria.pageSize" (pageSizeChange)="pageSizeChange($event)" [columns]="columns"
        [data]="tableData" [pageNo]="currentCriteria.pageNo" [totalCount]="count" (pageChange)="pageChange($event)"
        (sortChanged)="onSortChanged($event)" [activeSortField]="activeSortField"
        [activeSortDirection]="activeSortDirection" emptyMessage="No Executions available.">

        <ng-template ctCellFor="id" let-data let-i="index">
          <span class="text-primary pointer-link cursor" (click)="navigateToLogs(data)">{{data.id}}</span>
        </ng-template>

        <ng-template ctCellFor="statusIcon" let-data let-i="index">
          <span class="fa" [ngClass]="data.statusIcon" [tooltip]="data.tooltipMessage"></span>
        </ng-template>
      </app-generic-table>
    </div>
  </div>
</div>

<ng-template #popTemplate>
  <div class="col-12 p-0" *ngFor="let cat of listSummaryViewData?.remainingCategories; let i=index">
    <div class="row">
      <div class="col-8">
        <div class="row">
          <div class="col-12 text-muted text-value-xs mr-2">{{cat.category}}</div>
          <div class="col-4" *ngFor="let stat of cat.status">
            <span class="fa mr-1" [ngClass]="stat.icon"></span>
            <span class="text-primary text-value-xs">{{stat.count}}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
