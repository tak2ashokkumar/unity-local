<div class="row mt--3">
  <div class="col-12 p-0">
    <app-generic-table [title]="'Input Template'" [count]="count" [headerActions]="headerActions"
      (headerActionClick)="onHeaderAction($event)" (refresh)="refreshData()" [searchValue]="currentCriteria.searchValue"
      (searched)="onSearched($event)" [pageSize]="currentCriteria.pageSize" (pageSizeChange)="pageSizeChange($event)"
      [columns]="columns" [data]="viewData" [pageNo]="currentCriteria.pageNo" [totalCount]="count"
      (pageChange)="pageChange($event)" (statusToggle)="onStatusToggle($event)" (sortChanged)="onSortChanged($event)"
      [activeSortField]="activeSortField" [activeSortDirection]="activeSortDirection"
      emptyMessage="No templates available.">
      <ng-template ctCellFor="actions" let-view let-i="index">
        <button class="action-icons mb-0 fas fa-copy font-sm ml-1" tooltip="Clone"
          [ngClass]="view.type !== 'Manual' ? 'action-icons-disabled': 'action-icons'"
          (click)="view.type === 'Manual' ? cloneTemplate(view.name,view.uuid) : ''" accessControl
          moduleName="DevOps Automation" accessType="Manage DevOps Automation" elementType="actionbtn"></button>
        <button class="action-icons mb-0 fas fa-pencil-alt font-sm ml-1" tooltip="Edit"
          [ngClass]="view.type !== 'Manual' ? 'action-icons-disabled': 'action-icons'"
          (click)="view.type === 'Manual' ? editTemplate(view) : ''" accessControl moduleName="DevOps Automation"
          accessType="Manage DevOps Automation" elementType="actionbtn"></button>
        <button class="action-icons mb-0 far fa-trash-alt font-sm ml-1" tooltip="Delete"
          [ngClass]="view.type !== 'Manual' ? 'action-icons-disabled': 'action-icons'"
          (click)="view.type === 'Manual' ? deleteTemplate(view.uuid) : ''" accessControl moduleName="DevOps Automation"
          accessType="Manage DevOps Automation" elementType="actionbtn"></button>
      </ng-template>
    </app-generic-table>
  </div>
</div>
<ng-template #clone>
  <div class="card mb-0">
    <div class="card-header">
      Clone Template
      <div class="card-header-actions">
        <a class="card-header-action btn-close" (click)="cloneModalRef.hide()"><i class="fas fa-times"></i></a>
      </div>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-12 form-group">
          <label for="template_name" class="form-col-form-label">Name<em>*</em></label>
          <input id="template_name" class="form-control" type="text" [(ngModel)]="name">
        </div>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-sm btn-success pull-right ml-1" type="button" (click)="confirmClone()">Create</button>
      <button class="btn btn-sm btn-danger pull-right" (click)="cloneModalRef.hide()" type="button">Cancel</button>
    </div>
  </div>
</ng-template>
<ng-template #confirmdelete>
  <div class="card mb-0">
    <div class="card-header">
      Confirm Delete
      <div class="card-header-actions">
        <a class="card-header-action btn-close" (click)="deleteModalRef.hide()"><i class="fas fa-times"></i></a>
      </div>
    </div>
    <div class="card-body">This Template will be deleted. Are you sure you want to delete?</div>
    <div class="card-footer">
      <button class="btn btn-sm btn-success pull-right ml-1" type="button"
        (click)="confirmTemplateDelete()">Yes</button>
      <button class="btn btn-sm btn-danger pull-right" (click)="deleteModalRef.hide()" type="button">No</button>
    </div>
  </div>
</ng-template>
<ng-template #edit>
  <div class="card mb-0">
    <div class="card-body">
      <div class="row">
        <div class="col-12">All other executions were also affected. Are you sure want to edit the template?</div>
      </div>
      <div class="col-12 text-align-center mt-3">
        <button class="btn btn-pill btn-warning btn-sm pl-3 pr-3" type="button" (click)="confirmEdit()">Yes</button>
        <button class="btn btn-pill btn-outline-warning btn-sm ml-2" type="button"
          (click)="editModelRef.hide()">Cancel</button>
      </div>
    </div>
  </div>
</ng-template>
