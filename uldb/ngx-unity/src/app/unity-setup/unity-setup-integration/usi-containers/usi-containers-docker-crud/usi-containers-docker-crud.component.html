<div class="row mt-3 mx-2">
    <div class="col-12">
        <div class="card">
            <div class="card-title mb-2 px-2 py-2 border-bottom d-flex justify-content-between font-weight-bold">
                <span class="h6 pt-1 font-500">{{action}} Docker Controller</span>
                <button class="btn btn-pill btn-warning btn-sm text-right" (click)="goBack()" tooltip="Back">
                    <i class="fa fa-arrow-left"></i>
                </button>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-8 offset-2">
                        <div class="form-group" *ngIf="nonFieldErr">
                            <div class="invalid-credentials">{{nonFieldErr}}</div>
                        </div>
                        <form *ngIf="dockerForm" [formGroup]="dockerForm" enctype="multipart/form-data">
                            <div class="form-group">
                                <label class="form-col-form-label" for="name">Name<em>*</em></label>
                                <input class="form-control" id="name" type="text" formControlName="name"
                                    autocomplete="off" placeholder="Enter Name"
                                    [ngClass]="{'is-invalid' : dockerFormErrors.name}">
                                <div class="invalid-feedback" *ngIf="dockerFormErrors.name">{{dockerFormErrors.name}}</div>
                            </div>
                            <div class="form-group">
                                <label class="form-col-form-label" for="hostname">Hostname<em>*</em></label>
                                <input class="form-control" id="hostname" type="text" formControlName="hostname"
                                    autocomplete="off" placeholder="Enter Hostname"
                                    [ngClass]="{'is-invalid' : dockerFormErrors.hostname}">
                                <div class="invalid-feedback" *ngIf="dockerFormErrors.hostname">{{dockerFormErrors.hostname}}</div>
                            </div>
                        </form>
                        <form [formGroup]="attachmentForm" *ngIf="attachmentForm">
                            <div class="form-group row">
                                <label class="col-3 col-form-label" for="file-cert-input">Client Cert<em>*</em></label>
                                <div class="col-9">
                                    <input class="form-control" id="file-cert-input" name="file-cert-input" type="file"
                                        accept=".pem" [ngClass]="{'is-invalid' : attachmentFormErrors.cert}"
                                        (change)="handleCertFileInput($event.target.files)">
                                    <div class="invalid-feedback" *ngIf="attachmentFormErrors.cert">{{attachmentFormErrors.cert}}</div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-3 col-form-label" for="file-key-input">Client Key<em>*</em></label>
                                <div class="col-9">
                                    <input class="form-control" id="file-key-input" name="file-key-input" type="file"
                                        accept=".pem" [ngClass]="{'is-invalid' : attachmentFormErrors.key}"
                                        (change)="handleKeyFileInput($event.target.files)">
                                    <div class="invalid-feedback" *ngIf="attachmentFormErrors.key">{{attachmentFormErrors.key}}</div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-3 col-form-label" for="file-ca-input">Client CA<em>*</em></label>
                                <div class="col-9">
                                    <input class="form-control" id="file-ca-input" name="file-ca-input" type="file"
                                        accept=".pem" [ngClass]="{'is-invalid' : attachmentFormErrors.ca}"
                                        (change)="handleCaFileInput($event.target.files)">
                                    <div class="invalid-feedback" *ngIf="attachmentFormErrors.ca">{{attachmentFormErrors.ca}}</div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="card-footer bg-white border-top-0 d-flex justify-content-center py-3">
                <button class="btn btn-outline-danger" type="button" (click)="goBack()">Cancel</button>
                <button class="btn btn-success ml-3" type="button" (click)="onSubmit()">Submit</button>
            </div>
        </div>
    </div>
</div>
