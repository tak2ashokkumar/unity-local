<div class="container-fluid mt-3">
    <div class="animated fadeIn">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-2">
                        <div class="d-flex justify-content-center align-items-center font-500">
                            <span class="badge badge-secondary font-sm">{{count}}</span>
                            <span class="ml-1 font-lg">Accounts</span>
                        </div>
                        <div class="d-flex justify-content-end align-items-center">
                            <button class="btn btn-pill btn-sm btn-warning font-500" type="button"
                                (click)="goToAddAccount()" accessControl moduleName="Private Cloud"
                                accessType="Manage Private Cloud" elementType="btn">
                                <span class="font-xs-sm mx-1">Create Account</span>
                            </button>
                            <data-refresh-btn [page]="currentCriteria.pageNo"
                                (refresh)="refreshData($event)"></data-refresh-btn>
                            <button class="btn btn-pill btn-warning pull-right ml-2 btn-sm" type="button"
                                container="body" (click)="goBack()" tooltip="Back"><i class="fa fa-arrow-left"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body pt-2">
                        <div class="row mx-0 d-flex justify-content-between align-items-center pb-2">
                            <div class="w-25">
                                <search-box [searchValue]="currentCriteria.searchValue"
                                    (searched)="onSearched($event)"></search-box>
                            </div>
                            <div class="d-flex justify-content-end align-items-center w-40">
                                <table-page-size [currentPageSize]="currentCriteria.pageSize" [totalCount]="count"
                                    (pageSizeChange)="pageSizeChange($event)"></table-page-size>
                            </div>
                        </div>
                        <table class="table table-sm text-left">
                            <thead class="bg-light">
                                <tr>
                                    <th>Name</th>
                                    <th>URL</th>
                                    <th>Port</th>
                                    <th>Version</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let view of viewData" truncateText>
                                    <td class="tdw-20">
                                        <button class="btn btn-link text-decoration-none p-0 table-column-btn"
                                            type="button" [tooltip]="view.name">{{view.name}}</button>
                                    </td>
                                    <td class="tdw-25">
                                        <div [tooltip]="view.url">{{view.url}}</div>
                                    </td>
                                    <td class="tdw-10">
                                        <div [tooltip]="view.portText">{{view.portText}}</div>
                                    </td>
                                    <td class="tdw-15">
                                        <div [tooltip]="view.version">{{view.version}}</div>
                                    </td>
                                    <td class="action-icons-column">
                                        <button class="action-icons mb-0 fas fa-desktop font-sm"
                                            [tooltip]="remoteWebLaunching ? 'Opening Remote Web Viewer' : view.remoteWebTooltip"
                                            [disabled]="remoteWebLaunching || !view.showRemoteWebAccessButton"
                                            [ngClass]="{'action-icons-disabled': remoteWebLaunching || !view.showRemoteWebAccessButton}"
                                            (click)="remoteWebAccessNewTab(view)" accessControl moduleName="Private Cloud"
                                            accessType="Manage Private Cloud" elementType="actionbtn"></button>
                                        <button class="action-icons mb-0 fas fa-pencil-alt font-sm ml-1" tooltip="Edit"
                                            (click)="goToEditAccount(view)" accessControl moduleName="Private Cloud"
                                            accessType="Manage Private Cloud" elementType="actionbtn">
                                        </button>
                                        <button class="action-icons mb-0 fas fa-trash-alt font-sm ml-1" tooltip="Delete"
                                            (click)="deleteAccount(view)" accessControl moduleName="Private Cloud"
                                            accessType="Manage Private Cloud" elementType="actionbtn">
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <table-entries [pageNo]="currentCriteria.pageNo" [pageSize]="currentCriteria.pageSize"
                            [totalCount]="count"></table-entries>
                        <table-pager *ngIf="viewData.length" [pageNo]="currentCriteria.pageNo"
                            [pageSize]="currentCriteria.pageSize" [totalCount]="count"
                            (pageChange)="pageChange($event)"></table-pager>
                        <div class="text-center text-muted py-4" *ngIf="!viewData.length">No Firewall Management Center
                            accounts were found.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #deleteConfirm>
    <div class="card mb-0">
        <div class="card-header">
            Confirm Delete
            <div class="card-header-actions">
                <a class="card-header-action btn-close" (click)="deleteModalRef?.hide()">
                    <i class="fas fa-times"></i>
                </a>
            </div>
        </div>
        <div class="card-body">
            Are you sure you want to delete?
        </div>
        <div class="card-footer">
            <button class="btn btn-sm btn-success pull-right ml-1" type="button" (click)="confirmDelete()">Yes</button>
            <button class="btn btn-sm btn-danger pull-right" (click)="deleteModalRef?.hide()" type="button">No</button>
        </div>
    </div>
</ng-template>
